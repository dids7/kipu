# Publica as Cloud Functions do Kipu automaticamente.
# Roda quando algo dentro de functions/ (ou o firebase.json) muda no branch
# main — e também sob demanda: aba Actions → "Publicar Cloud Functions" →
# Run workflow.
#
# Precisa do segredo FIREBASE_SERVICE_ACCOUNT (chave JSON da conta de
# serviço), cadastrado em Settings → Secrets and variables → Actions.
# O segredo NÃO fica neste arquivo.
name: Publicar Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências das funções
        working-directory: functions
        run: npm install

      - name: Entrar no Google Cloud com a conta de serviço
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Instalar o Firebase CLI
        run: npm install -g firebase-tools

      - name: Publicar as funções
        run: firebase deploy --only functions --project kipu-c1e97 --non-interactive
